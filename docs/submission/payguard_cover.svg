<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">PayGuard AI hackathon cover</title>
  <desc id="description">PayGuard AI is a US-only synthetic merchant defense buffer. Before a draft, US AUP references and PayPal Sandbox support an unsent invoice draft. During fulfillment, deterministic velocity checks appear in AG Grid. After a dispute, a pseudonymized Internal Review ZIP and bounded Gemini brief support human review. PayPal or issuers retain final authority.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#backdrop)"/>
  <circle cx="1495" cy="106" r="298" fill="none" stroke="#dbeafe" stroke-width="70" opacity="0.7"/>
  <circle cx="1565" cy="57" r="190" fill="none" stroke="#e0e7ff" stroke-width="26" opacity="0.8"/>
  <rect x="72" y="56" width="54" height="54" rx="15" fill="#1e40af"/>
  <path d="M99 69 L115 76 L112 93 L99 101 L86 93 L83 76 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M92 85 L98 91 L108 78" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="144" y="94" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">PayGuard AI</text>
  <rect x="1244" y="63" width="284" height="39" rx="19.5" fill="#dbeafe"/>
  <text x="1386" y="88" text-anchor="middle" fill="#1e40af" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1">US-ONLY SYNTHETIC DEMO</text>
  <text x="72" y="208" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">Surface gaps early.</text>
  <text x="72" y="288" fill="#1e40af" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">Get evidence ready.</text>
  <text x="75" y="338" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="25">One merchant defense buffer, from AUP checks to sales signals to dispute review.</text>

  <g filter="url(#cardShadow)">
    <rect x="72" y="386" width="466" height="357" rx="23" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="567" y="386" width="466" height="357" rx="23" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="1062" y="386" width="466" height="357" rx="23" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  </g>
  <rect x="72" y="386" width="7" height="357" rx="3.5" fill="#2563eb"/>
  <rect x="567" y="386" width="7" height="357" rx="3.5" fill="#0d9488"/>
  <rect x="1062" y="386" width="7" height="357" rx="3.5" fill="#6366f1"/>

  <rect x="101" y="415" width="55" height="39" rx="12" fill="#dbeafe"/>
  <text x="128.5" y="442" text-anchor="middle" fill="#1d4ed8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">01</text>
  <text x="170" y="442" fill="#1e40af" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1">BEFORE DRAFT</text>
  <text x="102" y="508" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="800">AUP preflight</text>
  <text x="102" y="551" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="21">Policy signal; merchant edits,</text>
  <text x="102" y="581" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="21">cancels or acknowledges.</text>
  <path d="M102 615 H507" stroke="#e2e8f0" stroke-width="2"/>
  <text x="102" y="653" fill="#1e40af" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">TOOLS AND PROOF</text>
  <text x="102" y="685" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="19">US AUP references + Python rules</text>
  <text x="102" y="715" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="19">PayPal Sandbox OAuth + unsent draft</text>

  <rect x="596" y="415" width="55" height="39" rx="12" fill="#ccfbf1"/>
  <text x="623.5" y="442" text-anchor="middle" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">02</text>
  <text x="665" y="442" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1">FULFILLMENT</text>
  <text x="597" y="508" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="800">Velocity readiness</text>
  <text x="597" y="551" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="21">Local baseline flags a sales spike;</text>
  <text x="597" y="581" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="21">merchant checks missing records.</text>
  <path d="M597 615 H1002" stroke="#e2e8f0" stroke-width="2"/>
  <text x="597" y="653" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">TOOLS AND PROOF</text>
  <text x="597" y="685" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="19">FastAPI / Python baseline checks</text>
  <text x="597" y="715" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="19">AG Grid sorting, filtering and selection</text>

  <rect x="1091" y="415" width="55" height="39" rx="12" fill="#e0e7ff"/>
  <text x="1118.5" y="442" text-anchor="middle" fill="#4f46e5" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">03</text>
  <text x="1160" y="442" fill="#4f46e5" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1">AFTER DISPUTE</text>
  <text x="1092" y="508" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="800">Dispute evidence</text>
  <text x="1092" y="551" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="21">Match requested seller items;</text>
  <text x="1092" y="581" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="21">record local human review.</text>
  <path d="M1092 615 H1497" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1092" y="653" fill="#4f46e5" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">TOOLS AND PROOF</text>
  <text x="1092" y="685" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="19">Pseudonymized Internal Review ZIP</text>
  <text x="1092" y="715" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="19">Bounded Gemini evidence brief</text>

  <rect x="72" y="774" width="1456" height="76" rx="19" fill="#0f172a"/>
  <text x="102" y="821" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Rules first</text>
  <circle cx="258" cy="812" r="4" fill="#93c5fd"/>
  <text x="280" y="821" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Human review</text>
  <circle cx="484" cy="812" r="4" fill="#93c5fd"/>
  <text x="506" y="821" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">PayPal or issuers retain final authority</text>
  <text x="72" y="880" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="16">Sales and dispute examples are synthetic. No freeze prediction, payment, automatic evidence submission or provider verdict.</text>
</svg>

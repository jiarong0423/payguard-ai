<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">PayGuard AI merchant defense buffer</title>
  <desc id="description">A US-only synthetic demonstration of three stages: AUP warning before an unsent PayPal Sandbox invoice draft, sales-velocity evidence review in AG Grid, and local dispute evidence preparation with a bounded AI brief and human review. PayPal or issuers retain final authority.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#172554" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="44" y="37" width="259" height="31" rx="15.5" fill="#dbeafe"/>
  <text x="61" y="58" fill="#1e40af" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1">US-ONLY SYNTHETIC DEMO</text>
  <text x="44" y="125" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="55" font-weight="800">PayGuard AI</text>
  <text x="44" y="163" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500">One merchant defense buffer across the transaction lifecycle.</text>

  <g filter="url(#shadow)">
    <rect x="44" y="213" width="367" height="283" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="456" y="213" width="368" height="283" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="869" y="213" width="367" height="283" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  </g>
  <rect x="44" y="213" width="7" height="283" rx="3.5" fill="#2563eb"/>
  <rect x="456" y="213" width="7" height="283" rx="3.5" fill="#0d9488"/>
  <rect x="869" y="213" width="7" height="283" rx="3.5" fill="#6366f1"/>

  <text x="73" y="257" fill="#1d4ed8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">01  BEFORE DRAFT</text>
  <text x="73" y="307" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750">Spot policy warnings</text>
  <text x="73" y="345" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="21">Review, edit or acknowledge</text>
  <rect x="72" y="386" width="310" height="78" rx="12" fill="#eff6ff"/>
  <text x="88" y="418" fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">PAYPAL SANDBOX PROOF</text>
  <text x="88" y="447" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="17">OAuth + one unsent draft</text>

  <text x="485" y="257" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">02  FULFILLMENT</text>
  <text x="485" y="307" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750">See sales spikes</text>
  <text x="485" y="345" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="21">Check missing records</text>
  <rect x="484" y="386" width="310" height="78" rx="12" fill="#f0fdfa"/>
  <text x="500" y="418" fill="#115e59" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">AG GRID REVIEW</text>
  <text x="500" y="447" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="17">Sort, filter and select a row</text>

  <text x="898" y="257" fill="#4f46e5" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">03  DISPUTE</text>
  <text x="898" y="307" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750">Organize evidence</text>
  <text x="898" y="345" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="21">Match requested items</text>
  <rect x="897" y="386" width="310" height="78" rx="12" fill="#eef2ff"/>
  <text x="913" y="418" fill="#4338ca" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">LOCAL REVIEW PACKAGE</text>
  <text x="913" y="447" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="17">Internal ZIP + bounded AI brief</text>

  <path d="M419 353 L443 353" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M832 353 L856 353" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="44" y="532" width="1192" height="96" rx="18" fill="#0f172a"/>
  <text x="68" y="569" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">RULES FIRST</text>
  <text x="68" y="602" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="19">Bounded AI summarizes approved facts; merchants review every local action.</text>
  <text x="1098" y="584" text-anchor="end" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">PayPal / issuers decide</text>
  <text x="1098" y="609" text-anchor="end" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">No automatic submission</text>
  <text x="44" y="671" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="16">Sandbox proof is limited to OAuth and an unsent invoice draft. Sales and dispute scenarios use synthetic records.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="title description" data-embed-width="640" font-family="Inter, Arial, sans-serif">
  <title id="title">TradeGlot: checks first, one human approval, one Sandbox send</title>
  <desc id="description">Two swim lanes separate the deterministic code boundary from the bounded AI layer across three stages: a policy check and a ten-country rules check before an unsent PayPal Sandbox invoice draft, sales-spike review on an AG Charts chart with an AG Grid orders table, and dispute evidence with guided gap filling and a local review ZIP that is sent to PayPal Sandbox only after one human approval. Rules come first, nothing is sent automatically, and PayPal or the issuer decides. Sandbox proof covers OAuth, unsent invoice drafts, dispute list and detail reads and two evidence sends to author-created test disputes; sales and dispute scenarios use synthetic records. Designed for a 640 px wide thumbnail: the smallest text, 28 units in a 1280-unit viewBox, renders at 14 px.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker>
    <marker id="arr-ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
    <filter id="l1" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.06"/></filter>
    <filter id="l2" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <clipPath id="focal-clip"><rect x="860" y="256" width="380" height="224" rx="16"/></clipPath>
  </defs>
  <!-- L0 canvas -->
  <rect width="1280" height="760" fill="#eef1f6"/>

  <rect x="24" y="20" width="472" height="44" rx="22" fill="#e0e7ff"/>
  <text x="48" y="52" fill="#4338ca" font-size="28" font-weight="700" letter-spacing="1.5">SYNTHETIC DATA DEMO</text>
  <text x="24" y="126" fill="#0f172a" font-size="60" font-weight="800">TradeGlot</text>
  <text x="24" y="170" fill="#475569" font-size="28">Policy and ten-country checks first; one approval sends evidence.</text>

  <!-- Swim lane 1: Deterministic code boundary -->
  <rect x="20" y="194" width="1240" height="304" rx="16" fill="#f6f8fb" stroke="#e3e7ee" stroke-width="2"/>
  <rect x="40" y="206" width="430" height="38" rx="19" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="60" y="234" fill="#4338ca" font-size="28" font-weight="700">Deterministic code boundary</text>

  <!-- Three stages with pill step badges -->
  <g class="box">
    <rect x="40" y="256" width="380" height="224" rx="16" fill="#ffffff" stroke="#e3e7ee" stroke-width="1.5" filter="url(#l1)"/>
    <rect x="64" y="276" width="286" height="42" rx="21" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="84" y="306" fill="#4338ca" font-size="28" font-weight="700">01 BEFORE DRAFT</text>
    <text x="64" y="376" fill="#0f172a" font-size="38" font-weight="800">Policy checks</text>
    <text x="64" y="438" fill="#475569" font-size="28">10-country rules first</text>
  </g>
  <g class="box">
    <rect x="450" y="256" width="380" height="224" rx="16" fill="#ffffff" stroke="#e3e7ee" stroke-width="1.5" filter="url(#l1)"/>
    <rect x="474" y="276" width="276" height="42" rx="21" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="494" y="306" fill="#4338ca" font-size="28" font-weight="700">02 FULFILLMENT</text>
    <text x="474" y="376" fill="#0f172a" font-size="38" font-weight="800">Sales spikes</text>
    <text x="474" y="438" fill="#475569" font-size="28">AG Charts + AG Grid</text>
  </g>
  <g class="box" id="focal">
    <rect x="860" y="256" width="380" height="224" rx="16" fill="#ffffff" stroke="#4f46e5" stroke-opacity="0.45" stroke-width="2" filter="url(#l2)"/>
    <g clip-path="url(#focal-clip)">
      <rect x="860" y="256" width="380" height="78" fill="#eef2ff"/>
      <rect x="860" y="256" width="4" height="224" fill="#4f46e5"/>
    </g>
    <rect x="884" y="276" width="214" height="42" rx="21" fill="#4f46e5"/>
    <text x="904" y="306" fill="#ffffff" font-size="28" font-weight="700">03 DISPUTE</text>
    <text x="884" y="376" fill="#0f172a" font-size="38" font-weight="800">Dispute evidence</text>
    <text x="884" y="438" fill="#475569" font-size="28">Approve → Sandbox send</text>
  </g>

  <!-- Smooth connectors between stages -->
  <path d="M420 368 L434 368 L448 368" stroke="#4f46e5" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M830 368 L844 368 L858 368" stroke="#4f46e5" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- Smooth cubic connector into Bounded AI layer -->
  <path d="M1050 480 L1049 488 L1044 496 L1035 504 L1022 510 L1005 516 L988 522 L975 528 L966 534 L961 540 L960 546" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arr-ai)"/>

  <!-- Swim lane 2: Bounded AI layer -->
  <rect x="20" y="516" width="1240" height="168" rx="16" fill="#eef7f6" stroke="#0f766e" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="40" y="528" width="286" height="38" rx="19" fill="#e7f5f3" stroke="#0f766e" stroke-width="1.5"/>
  <text x="60" y="556" fill="#0f766e" font-size="28" font-weight="700">Bounded AI layer</text>

  <g class="box">
    <rect x="40" y="576" width="584" height="92" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" filter="url(#l1)"/>
    <text x="64" y="616" fill="#0f766e" font-size="28" font-weight="700">Guided gap filling &amp; AI brief</text>
    <text x="64" y="652" fill="#475569" font-size="28">Rules first · nothing sent unapproved</text>
  </g>
  <g class="box">
    <rect x="656" y="576" width="584" height="92" rx="12" fill="#ffffff" stroke="#e3e7ee" stroke-width="1.5" filter="url(#l1)"/>
    <text x="680" y="616" fill="#0f172a" font-size="28" font-weight="700">Human review &amp; authority</text>
    <text x="680" y="652" fill="#4338ca" font-size="28" font-weight="700">PayPal or the issuer decides</text>
  </g>
  <path d="M624 622 L639 622 L654 622" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arr-ai)"/>

  <text x="24" y="732" fill="#475569" font-size="28">Synthetic records · Sandbox: OAuth, unsent drafts, dispute reads, two evidence sends</text>
</svg>

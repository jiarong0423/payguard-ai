<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="ov-t ov-d">
<title id="ov-t">TradeGlot: how it works</title>
<desc id="ov-d">Architecture: seller console, TradeGlot server funnel, PayPal Sandbox, PayPal's official MCP server (one read-only run), Gemini and Channel3, plus APIMatic, Postman, Render and our own MCP server, each tagged with the file that holds its evidence.</desc>
<!-- r10 (2026-11-09): sponsor tools placed where used, each tagged with its proof file. -->

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="a93-t a93-d">
<title id="a93-t">TradeGlot: how it works</title>
<desc id="a93-d">Simplified architecture: seller console (AG Grid, AG Charts, AG Studio, Bryntum), TradeGlot server funnel (input gate, rules, optional Gemini, code checks), PayPal Sandbox and Gemini services. The model never approves or sends.</desc>
<!-- r9.3 (2026-11-04): simplified video cut of r9.2; r9.2 remains the README version. -->
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b3a36"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a6a4e"/></marker>
<marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>
</defs>
<rect width="1920" height="1080" fill="#fbf7ef"/>
<text x="80" y="104" font-size="60" font-weight="700" fill="#1f1e1b">TradeGlot: how it works</text>
<text x="80" y="162" font-size="34" fill="#5b5953">Rules first. Code checks every result. The seller decides.</text>
<text x="80" y="206" font-size="24" fill="#5b5953">Local console: real Sandbox and Gemini calls. Hosted demo: rules by default, Sandbox reads, one capped send.</text>
<text x="80" y="252" font-size="26" font-weight="700" fill="#8a877f" letter-spacing="3">SELLER</text>
<text x="640" y="252" font-size="26" font-weight="700" fill="#8a877f" letter-spacing="3">TRADEGLOT SERVER</text>
<text x="1440" y="252" font-size="26" font-weight="700" fill="#8a877f" letter-spacing="3">SERVICES</text>
<rect x="80" y="284" width="480" height="214" rx="18" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
<text x="112" y="352" font-size="38" font-weight="700" fill="#1f1e1b">Seller console</text>
<text x="112" y="400" font-size="28" fill="#5b5953">3 steps · evidence guide</text>
<text x="112" y="438" font-size="24" fill="#5b5953">AG Grid · AG Charts · AG Studio</text>
<text x="112" y="472" font-size="24" fill="#5b5953">Bryntum deadline board</text>
<rect x="80" y="540" width="480" height="200" rx="18" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
<text x="112" y="608" font-size="38" font-weight="700" fill="#1f1e1b">Two-step send</text>
<text x="112" y="660" font-size="28" fill="#5b5953">tick → <tspan fill="#c2410c" font-weight="700">Continue</tspan> → 3 s → <tspan fill="#4a6a4e" font-weight="700">Send</tspan></text>
<text x="112" y="702" font-size="24" fill="#5b5953">single-use server confirmation</text>
<rect x="640" y="284" width="720" height="560" rx="26" fill="#f1eee6" stroke="#3b3a36" stroke-width="3"/>

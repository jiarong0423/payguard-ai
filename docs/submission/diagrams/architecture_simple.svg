<text x="1472" y="404" font-size="28" fill="#5b5953">one approval = one send</text>
<text x="1472" y="446" font-size="26" fill="#5b5953">six real sends (one hosted)</text>
<rect x="1440" y="584" width="400" height="168" rx="18" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
<text x="1472" y="652" font-size="38" font-weight="700" fill="#1f1e1b">Gemini</text>
<text x="1472" y="704" font-size="28" fill="#5b5953">key in a separate worker</text>

<text x="1000" y="718" font-size="32" font-weight="700" fill="#c2410c" text-anchor="middle">The model never approves,</text>
<text x="1000" y="764" font-size="32" font-weight="700" fill="#c2410c" text-anchor="middle">sends or decides a case</text>

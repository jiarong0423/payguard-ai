<text x="88" y="740" class="t" font-size="28">What is inside</text>
<text x="88" y="780" class="m" font-size="16" fill="#55534e">requirement: PROOF_OF_FULFILLMENT · STRUCTURALLY_PRESENT · seller response due 2026-11-06 · 5 official PayPal sources cited</text>
<text x="88" y="808" class="m" font-size="16" fill="#55534e">pseudonymised: address, email, id_like, manual, name, us_phone · HMAC-SHA256 · no reverse map in the pack</text>
<text x="88" y="836" class="m" font-size="16" fill="#55534e">left out on purpose: raw case order request identifiers, identity session draft digests, restricted proof values, attachment filenames and bytes, unknown fields</text>
<text x="88" y="864" class="m" font-size="16" fill="#55534e">synthetic demo data · advisory only · not a PayPal attachment · PayPal or the card issuer decides</text>
<text x="64" y="944" class="m" font-size="14" letter-spacing="1.5" fill="#6b6862">REPEAT IT YOURSELF</text>
<text x="64" y="980" class="m" font-size="18" fill="#1f1e1b">unzip -p review.zip README.txt | shasum -a 256      # compare with manifest.json "sha256"</text>
<text x="64" y="1016" class="m" font-size="16" fill="#6b6862">this ZIP: sha256 7db4a239418facf083392a8802757b04dfd5b6d59705330c332fd4df05d481ba</text>
